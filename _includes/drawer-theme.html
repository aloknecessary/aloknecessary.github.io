<style>
  .drawer-theme {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    padding: 0.25rem 0;
  }

  .drawer-theme-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .drawer-theme-btns {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .drawer-theme-btn {
    background: none;
    border: none;
    padding: 0.55rem 0 0.55rem 0.75rem;
    font-size: 1rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    transition: color 0.2s;
  }

  .drawer-theme-btn-text {
    color: var(--text-secondary);
  }

  .drawer-theme-btn.active .drawer-theme-btn-text {
    background: linear-gradient(90deg, var(--primary), var(--coral));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 600;
    padding-bottom: 3px;
    padding-right: 3px;
    border-bottom: 2px solid transparent;
    border-image: linear-gradient(90deg, var(--primary), var(--coral)) 1;
  }

  .drawer-pref-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.3rem 0 0.3rem 0.75rem;
    gap: 0.5rem;
  }

  .drawer-pref-row-label {
    font-size: 0.85rem;
    color: var(--text-secondary);
    flex-shrink: 0;
  }

  .drawer-pref-btns {
    display: flex;
    gap: 0.3rem;
  }

  .drawer-pref-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.2rem 0.5rem;
    font-size: 0.78rem;
    font-family: inherit;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    white-space: nowrap;
  }

  .drawer-pref-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .drawer-pref-btn.active {
    border-color: var(--primary);
    background: color-mix(in srgb, var(--primary) 12%, transparent);
    color: var(--primary);
    font-weight: 600;
  }
</style>

<hr class="nav-drawer-divider">
<div class="drawer-theme">
  <span class="drawer-theme-label">Appearance</span>
  <div class="drawer-theme-btns">
    <button class="drawer-theme-btn" data-pref-theme="light"><span class="drawer-theme-btn-text">☀ Light</span></button>
    <button class="drawer-theme-btn" data-pref-theme="dark"><span class="drawer-theme-btn-text">🌙 Dark</span></button>
    <button class="drawer-theme-btn" data-pref-theme="system"><span class="drawer-theme-btn-text">🖥 System</span></button>
  </div>
</div>

<hr class="nav-drawer-divider">
<div class="drawer-theme">
  <span class="drawer-theme-label">Blog listing</span>
  <div class="drawer-pref-row">
    <span class="drawer-pref-row-label">Articles per page</span>
    <div class="drawer-pref-btns">
      <button class="drawer-pref-btn" data-pref-posts="10">10</button>
      <button class="drawer-pref-btn" data-pref-posts="20">20</button>
      <button class="drawer-pref-btn" data-pref-posts="30">30</button>
    </div>
  </div>
</div>

<hr class="nav-drawer-divider">
<div class="drawer-theme">
  <span class="drawer-theme-label">Notifications</span>
  <div class="drawer-pref-row">
    <span class="drawer-pref-row-label">Show banner for</span>
    <div class="drawer-pref-btns">
      <button class="drawer-pref-btn" data-pref-banner="12">12h</button>
      <button class="drawer-pref-btn" data-pref-banner="24">24h</button>
      <button class="drawer-pref-btn" data-pref-banner="0">Off</button>
    </div>
  </div>
  <div class="drawer-pref-row">
    <span class="drawer-pref-row-label">Suppress on visit</span>
    <div class="drawer-pref-btns">
      <button class="drawer-pref-btn" data-pref-suppress="yes">Yes</button>
      <button class="drawer-pref-btn" data-pref-suppress="no">No</button>
    </div>
  </div>
</div>

<script>
(function() {
  var drawerEl = document.currentScript.closest('.nav-drawer, .an-mobile-drawer');
  function init() {
    if (typeof window.initPrefDrawer === 'function') {
      window.initPrefDrawer(drawerEl);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
